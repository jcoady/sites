name: Update Directory Menu

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'index.html'

jobs:
  build-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate index.html
        run: python .github/scripts/build_index.py

      - name: Commit updated menu
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update directory menu"
          git push
